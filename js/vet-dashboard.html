<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's queue | VetNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="app-page" data-role="vet" data-page="queue">

    <div class="app-shell">

        <!-- Sidebar and top bar are filled in by js/shell.js -->
        <aside class="sidebar" id="sidebar"></aside>

        <div class="app-main">
            <header class="topbar" id="topbar"></header>

            <main class="app-content">

                <div class="page-head">
                    <div>
                        <h1 id="vetTitle">Today's queue</h1>
                        <p id="vetSub">Patients booked with you.</p>
                    </div>
                </div>

                <section class="stat-grid" id="stats" aria-label="Summary"></section>

                <div class="tabs" role="tablist">
                    <button type="button" class="tab active" data-tab="today" role="tab">Today</button>
                    <button type="button" class="tab" data-tab="upcoming" role="tab">Upcoming</button>
                </div>

                <div id="queue"></div>
            </main>
        </div>

    </div>

    <dialog class="modal" id="completeDialog" aria-labelledby="completeTitle">
        <form class="modal-body" id="completeForm">
            <h2 id="completeTitle">Complete visit</h2>
            <p class="muted" id="completeSub">This saves a record to the pet's health history.</p>
            <input type="hidden" id="completeId">
            <div class="form-stack">
                <div class="field">
                    <label for="completeSummary">Visit summary</label>
                    <input type="text" id="completeSummary" placeholder="e.g. Annual checkup" required>
                </div>
                <div class="field">
                    <label for="completeNotes">Notes for the owner <span class="muted">(optional)</span></label>
                    <textarea id="completeNotes" placeholder="Diagnosis, medication, care instructions"></textarea>
                </div>
                <div class="field">
                    <label for="completeDue">Follow-up or next vaccine due <span class="muted">(optional)</span></label>
                    <input type="date" id="completeDue">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="button button-ghost" data-close>Cancel</button>
                <button type="submit" class="button button-primary">Complete visit</button>
            </div>
        </form>
    </dialog>

    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/staff.js"></script>

</body>
</html>
