<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live overview | VetNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="app-page" data-role="hospital" data-page="overview">

    <div class="app-shell">

        <!-- Sidebar and top bar are filled in by js/shell.js -->
        <aside class="sidebar" id="sidebar"></aside>

        <div class="app-main">
            <header class="topbar" id="topbar"></header>

            <main class="app-content">

                <div class="page-head">
                    <div>
                        <h1 id="hospTitle">Live overview</h1>
                        <p>See every doctor's queue as it moves.</p>
                    </div>
                    <div class="page-actions">
                        <a href="hospital-appointments.html" class="button button-ghost">All appointments</a>
                    </div>
                </div>

                <section class="stat-grid" id="stats" aria-label="Summary"></section>

                <h2 class="group-title">Doctors on duty</h2>
                <div class="board" id="board"></div>

                <h2 class="group-title" style="margin-top:30px">Today's patients</h2>
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr><th>Time</th><th>Patient</th><th>Doctor</th><th>Reason</th><th>Status</th><th></th></tr>
                        </thead>
                        <tbody id="liveTable"></tbody>
                    </table>
                </div>
            </main>
        </div>

    </div>

    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/staff.js"></script>

</body>
</html>
