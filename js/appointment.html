<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book appointment | VetNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="app-page" data-role="owner" data-page="booking">

    <div class="app-shell">

        <!-- Sidebar and top bar are filled in by js/shell.js -->
        <aside class="sidebar" id="sidebar"></aside>

        <div class="app-main">
            <header class="topbar" id="topbar"></header>

            <main class="app-content">

                <div class="page-head">
                    <div>
                        <h1>Book an appointment</h1>
                        <p>Choose your pet, a hospital, a veterinarian and a time.</p>
                    </div>
                </div>

                <div class="book-steps" id="bookSteps" aria-label="Booking progress"></div>

                <div class="book-grid">
                    <section class="card" id="bookCard">
                        <div id="stepBody"></div>
                        <div class="step-actions">
                            <button type="button" class="button button-ghost" id="backBtn">Back</button>
                            <button type="button" class="button button-primary" id="nextBtn">Continue</button>
                        </div>
                    </section>

                    <aside class="card summary" aria-label="Booking summary">
                        <div class="card-head"><h2>Your booking</h2></div>
                        <dl id="summary"></dl>
                    </aside>
                </div>
            </main>
        </div>

    </div>

    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/owner.js"></script>

</body>
</html>
