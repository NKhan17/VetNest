<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | VetNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="app-page" data-role="owner" data-page="dashboard">

    <div class="app-shell">

        <!-- Sidebar and top bar are filled in by js/shell.js -->
        <aside class="sidebar" id="sidebar"></aside>

        <div class="app-main">
            <header class="topbar" id="topbar"></header>

            <main class="app-content">

                <div class="page-head">
                    <div>
                        <h1 id="greeting">Welcome</h1>
                        <p>Here is what is happening with your pets today.</p>
                    </div>
                    <div class="page-actions">
                        <a href="appointment.html" class="button button-primary">Book appointment</a>
                    </div>
                </div>

                <section class="stat-grid" id="stats" aria-label="Summary"></section>

                <div class="dash-grid">
                    <section class="card live-card span-2" id="liveCard" aria-live="polite"></section>

                    <section class="card">
                        <div class="card-head">
                            <h2>Upcoming appointments</h2>
                            <a href="tracking.html" class="link">View all</a>
                        </div>
                        <div class="rows" id="upcomingList"></div>
                    </section>

                    <section class="card">
                        <div class="card-head">
                            <h2>Reminders</h2>
                            <a href="records.html" class="link">Health records</a>
                        </div>
                        <div class="rows" id="reminders"></div>
                    </section>

                    <section class="card span-2">
                        <div class="card-head">
                            <h2>My pets</h2>
                            <a href="pets.html" class="link">Manage pets</a>
                        </div>
                        <div class="pet-grid" id="petStrip"></div>
                    </section>
                </div>
            </main>
        </div>

    </div>

    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/owner.js"></script>

</body>
</html>
