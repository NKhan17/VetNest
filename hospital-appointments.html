<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments | VetNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="app-page" data-role="hospital" data-page="appointments">

    <div class="app-shell">

        <!-- Sidebar and top bar are filled in by js/shell.js -->
        <aside class="sidebar" id="sidebar"></aside>

        <div class="app-main">
            <header class="topbar" id="topbar"></header>

            <main class="app-content">

                <div class="page-head">
                    <div>
                        <h1>Appointments</h1>
                        <p>Search, filter and manage every booking at your hospital.</p>
                    </div>
                </div>

                <div class="toolbar">
                    <input type="search" class="search-input" id="apptSearch" placeholder="Search pet, owner or token" aria-label="Search appointments">
                    <select id="fltWhen" aria-label="Date">
                        <option value="today">Today</option>
                        <option value="upcoming">Upcoming</option>
                        <option value="past">Past</option>
                        <option value="all">All dates</option>
                    </select>
                    <select id="fltStatus" aria-label="Status">
                        <option value="all">All statuses</option>
                        <option value="booked">Scheduled</option>
                        <option value="checked-in">Waiting</option>
                        <option value="in-consult">In consultation</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                    <select id="fltVet" aria-label="Doctor"></select>
                </div>

                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr><th>Date</th><th>Time</th><th>Patient</th><th>Owner</th><th>Doctor</th><th>Reason</th><th>Status</th><th></th></tr>
                        </thead>
                        <tbody id="apptTable"></tbody>
                    </table>
                </div>
            </main>
        </div>

    </div>

    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/staff.js"></script>

</body>
</html>
